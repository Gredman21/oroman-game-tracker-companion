<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#101319">
  <title>Tracker TCG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="setup-screen" class="screen setup-screen">
    <form id="setup-form" class="setup-card">
      <div class="setup-heading">
        <span class="eyebrow">TRACKER TCG</span>
        <h1>Configurar partida</h1>
      </div>

      <label class="field">
        <span>Quantidade de jogadores</span>
        <select id="player-count">
          <option value="2">2 jogadores</option>
          <option value="3">3 jogadores</option>
          <option value="4">4 jogadores</option>
          <option value="5">5 jogadores</option>
          <option value="6">6 jogadores</option>
        </select>
      </label>

      <fieldset class="field">
        <legend>Direção dos turnos</legend>
        <div class="segmented">
          <label><input type="radio" name="direction" value="clockwise" checked><span>Horário</span></label>
          <label><input type="radio" name="direction" value="counterclockwise"><span>Anti-horário</span></label>
        </div>
      </fieldset>

      <label class="switch-row">
        <span><strong>Usar cronômetro</strong><small>O tempo começa pelo menu da partida.</small></span>
        <input id="timer-enabled" type="checkbox">
        <i aria-hidden="true"></i>
      </label>

      <div id="timer-settings" class="timer-settings" hidden>
        <fieldset class="field">
          <legend>Tipo de tempo</legend>
          <div class="segmented">
            <label><input type="radio" name="timer-mode" value="total" checked><span>Total</span></label>
            <label><input type="radio" name="timer-mode" value="individual"><span>Por jogador</span></label>
          </div>
        </fieldset>

        <div class="field">
          <span>Tempo da partida</span>
          <div class="time-inputs">
            <label><input id="minutes" type="number" min="0" max="99" value="50" inputmode="numeric"><small>min</small></label>
            <b>:</b>
            <label><input id="seconds" type="number" min="0" max="99" value="0" inputmode="numeric"><small>seg</small></label>
          </div>
        </div>
      </div>

      <button class="primary-button" type="submit">Montar mesa</button>
    </form>
  </main>

  <main id="game-screen" class="screen game-screen" hidden>
    <section id="players" class="players" aria-label="Jogadores"></section>
    <button id="turn-button" class="turn-button" type="button" aria-label="Passar turno. Segure para abrir as opções.">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h9.2l-2.6-2.6L15 3l5 5-5 5-1.4-1.4L16.2 9H7a3 3 0 0 0-3 3v1H2v-1a5 5 0 0 1 5-5Zm10 10H7.8l2.6 2.6L9 21l-5-5 5-5 1.4 1.4L7.8 15H17a3 3 0 0 0 3-3v-1h2v1a5 5 0 0 1-5 5Z"/></svg>
    </button>
  </main>

  <div id="options-modal" class="modal" aria-hidden="true">
    <div class="modal-card options-card" role="dialog" aria-modal="true" aria-labelledby="options-title">
      <button class="close-button" data-close-modal type="button" aria-label="Fechar">×</button>
      <h2 id="options-title">Partida</h2>
      <button id="start-game" class="primary-button" type="button">Iniciar partida</button>
      <button id="fullscreen-toggle" class="secondary-button" type="button">Entrar em tela cheia</button>
      <button id="restart-game" class="danger-button" type="button">Reiniciar partida</button>
      <button id="back-to-settings" class="text-button" type="button">Voltar às configurações</button>
    </div>
  </div>

  <div id="counter-modal" class="modal" aria-hidden="true">
    <div class="modal-card counter-settings-card" role="dialog" aria-modal="true" aria-labelledby="counter-title">
      <button class="close-button" data-close-modal type="button" aria-label="Fechar">×</button>
      <h2 id="counter-title">Configurar recurso</h2>
      <div id="color-options" class="color-options"></div>
      <div id="macro-settings" class="macro-settings desktop-only">
        <button id="macro-plus" class="secondary-button" type="button">Atalho para aumentar: não definido</button>
        <button id="macro-minus" class="secondary-button" type="button">Atalho para diminuir: não definido</button>
        <label class="checkbox-row"><input id="show-macro-labels" type="checkbox"> Exibir atalhos nos botões</label>
      </div>
      <button class="primary-button" data-close-modal type="button">Concluir</button>
    </div>
  </div>

  <div id="macro-capture" class="capture" hidden>
    <strong>Pressione uma tecla para salvar</strong>
    <small>ESC cancela</small>
  </div>

  <template id="player-template">
    <article class="player">
      <div class="player-face">
        <input class="player-name" aria-label="Nome do jogador">
        <section class="life counter" data-kind="life" data-value="7">
          <button class="counter-settings" type="button" aria-label="Configurar cordas">⚙</button>
          <button class="minus" type="button" aria-label="Diminuir cordas">−</button>
          <div class="counter-center"><span class="counter-label">CORDAS</span><strong class="value">7</strong><em class="delta"></em></div>
          <button class="plus" type="button" aria-label="Aumentar cordas">+</button>
        </section>
        <section class="resources">
          <div class="resource counter" data-kind="resource" data-slot="1" data-value="0">
            <button class="counter-settings" type="button" aria-label="Configurar recurso">⚙</button>
            <button class="plus" type="button" aria-label="Aumentar recurso">+</button>
            <div class="counter-center"><span class="counter-label">ATEMPORAL</span><strong class="value">0</strong><em class="delta"></em></div>
            <button class="minus" type="button" aria-label="Diminuir recurso">−</button>
          </div>
          <div class="resource counter" data-kind="resource" data-slot="2" data-value="0">
            <button class="counter-settings" type="button" aria-label="Configurar recurso">⚙</button>
            <button class="plus" type="button" aria-label="Aumentar recurso">+</button>
            <div class="counter-center"><span class="counter-label">ATEMPORAL</span><strong class="value">0</strong><em class="delta"></em></div>
            <button class="minus" type="button" aria-label="Diminuir recurso">−</button>
          </div>
        </section>
        <div class="player-timer" hidden><span>TEMPO</span><strong>00:00</strong></div>
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
